<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <script>
      // Theme preference: 'system' (default) | 'light' | 'dark'. Applied before first
      // paint so there is no flash. Shared across all tools on this origin. See DESIGN.md.
      (function () {
        try {
          var d = document.documentElement, ls = localStorage;
          // One-time cleanup: earlier versions stored the OS value as if it were a choice.
          ls.removeItem('theme');
          ls.removeItem('pdf-theme');
          var p = ls.getItem('theme-preference');
          if (p !== 'light' && p !== 'dark') p = 'system';
          d.setAttribute('data-theme-pref', p);
          if (p !== 'system') {
            d.setAttribute('data-theme', p);
            var c = p === 'dark' ? '#09090b' : '#fafafa';
            var m = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < m.length; i++) m[i].setAttribute('content', c);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
